<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UX Issue Showcase</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: "Acherus Grotesque";
    font-style: normal; font-weight: 400; font-display: swap;
    src: url("https://sl-design-team.github.io/jellyroll/fonts/acherus-grotesque-regular.woff2") format("woff2");
  }
  @font-face {
    font-family: "Acherus Grotesque";
    font-style: normal; font-weight: 800; font-display: swap;
    src: url("https://sl-design-team.github.io/jellyroll/fonts/acherus-grotesque-extrabold.woff2") format("woff2");
  }

  :root {
    /* JellyRoll (SnapLogic Design System 2.0) tokens — sl-design-team.github.io/jellyroll */
    --sl-blue-600: #0841B4;
    --sl-teal-600: #09817F;
    --sl-teal-700: #076766;
    --sl-red-600: #E31C3D;
    --sl-red-700: #B61631;
    --sl-red-100: #FCE8EC;
    --sl-red-50:  #FDF3F5;
    --sl-orange-700: #C75209;
    --sl-orange-100: #FEF0E7;
    --sl-grey-100: #F5F6F8;
    --sl-grey-200: #EBEDF1;
    --sl-grey-300: #D7DCE3;
    --sl-grey-700: #7D8695;
    --sl-grey-800: #5E6470;
    --sl-indigo-900: #131C35;

    --color-text-heading: var(--sl-indigo-900);
    --color-text-body: var(--sl-indigo-900);
    --color-text-subtle: var(--sl-grey-700);
    --color-text-link-hover: var(--sl-teal-600);
    --color-surface-raised: #fff;
    --color-border-subtle: var(--sl-grey-300);
    --color-border-hover: var(--sl-blue-600);

    --font-sans: "Acherus Grotesque", system-ui, "SF Pro", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --type-title-size: 32px;  --type-title-line: 38px;  --type-title-weight: 800;
    --type-label-size: 14px;  --type-label-line: 22px;  --type-label-weight: 800;
    --type-body-size: 14px;   --type-body-line: 22px;   --type-body-weight: 400;
    --type-small-size: 12px;  --type-small-line: 18px;  --type-small-weight: 400;
    --type-pill-size: 10px;   --type-pill-line: 14px;   --type-pill-weight: 800;  --type-pill-tracking: 0.06em;

    --space-2: 8px;  --space-3: 12px;  --space-4: 16px;  --space-6: 24px;  --space-10: 40px;

    --radius-sm: 4px;  --radius-md: 6px;  --radius-pill: 999px;

    --shadow-raised: 0px 2px 4px rgba(206, 217, 240, 0.8);
    --shadow-raised-hover: 0px 4px 8px rgba(206, 217, 240, 1);
  }

  body {
    font-family: var(--font-sans);
    background: var(--sl-grey-200);
    color: var(--color-text-body);
    padding-bottom: var(--space-10);
  }

  .topbar { height: 4px; background: var(--sl-teal-600); }

  .wrap { max-width: 760px; margin: 0 auto; padding: var(--space-10) var(--space-6) 0; }

  header { margin-bottom: var(--space-2); }
  h1 {
    font-size: var(--type-title-size);
    line-height: var(--type-title-line);
    font-weight: var(--type-title-weight);
    letter-spacing: -0.01em;
    color: var(--color-text-heading);
  }
  .sub { color: var(--color-text-subtle); margin-bottom: var(--space-10); line-height: 1.5; font-size: var(--type-body-size); max-width: 52ch; }

  .area-title {
    font-family: var(--font-sans);
    font-size: 17px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--sl-blue-600);
    letter-spacing: 0.03em;
    margin: var(--space-10) 0 var(--space-3);
    padding-bottom: var(--space-2);
    border-bottom: 1px solid var(--color-border-subtle);
  }
  .area-title:first-of-type { margin-top: 0; }

  .section-title {
    font-size: var(--type-label-size);
    line-height: var(--type-label-line);
    font-weight: var(--type-label-weight);
    color: var(--color-text-heading);
    margin: var(--space-6) 0 var(--space-2);
  }

  .list-header {
    display: flex;
    justify-content: flex-end;
    padding: 0 42px 4px 0;
  }
  .list-header span {
    font-size: var(--type-small-size);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-subtle);
  }

  .empty {
    border: 1px dashed var(--color-border-subtle);
    border-radius: var(--radius-md);
    padding: var(--space-4) var(--space-4);
    color: var(--color-text-subtle);
    font-family: var(--font-mono);
    font-size: var(--type-small-size);
  }

  .page-list { list-style: none; }
  .page-item { margin-bottom: var(--space-2); }
  .page-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4);
    box-shadow: var(--shadow-raised);
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .page-link:hover {
    border-color: var(--color-border-hover);
    box-shadow: var(--shadow-raised-hover);
  }
  .page-link .title {
    font-size: var(--type-label-size);
    line-height: var(--type-label-line);
    font-weight: var(--type-label-weight);
    color: var(--color-text-heading);
  }
  .page-link:hover .title { color: var(--color-text-link-hover); }
  .page-link .right { display: flex; align-items: center; gap: var(--space-3); }
  .chevron { color: var(--color-text-subtle); font-size: var(--type-label-size); line-height: 1; }
  .page-link:hover .chevron { color: var(--color-text-link-hover); }
  .severity {
    font-size: var(--type-pill-size);
    line-height: var(--type-pill-line);
    font-weight: var(--type-pill-weight);
    text-transform: uppercase;
    letter-spacing: var(--type-pill-tracking);
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .severity-highest { background: var(--sl-red-600); color: #fff; }
  .severity-high { background: var(--sl-red-100); color: var(--sl-red-700); }
  .severity-medium { background: var(--sl-orange-100); color: var(--sl-orange-700); }
  .severity-low { background: var(--sl-grey-200); color: var(--sl-grey-800); }

  .issue-count {
    font-size: var(--type-pill-size);
    line-height: var(--type-pill-line);
    font-weight: var(--type-pill-weight);
    text-transform: uppercase;
    letter-spacing: var(--type-pill-tracking);
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
    background: transparent;
    color: var(--color-text-subtle);
    border: 1px solid var(--color-border-subtle);
  }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <header>
    <h1>UX issue showcase</h1>
  </header>
  <p class="sub">Confusing UI interactions and microcopy across the SnapLogic Admin UI, with proposed fixes — for PM and engineering review.</p>
  <div id="app"><p class="empty">// loading issue catalog…</p></div>
</div>

<script>
const AREAS = ["Admin Manager", "Monitor", "SnapGPT"];

// Pages with more than one issue get a landing page listing them.
// Pages with exactly one issue link straight to that issue's comparison.html.
const LANDING_PAGES = {
  "Authentication": "admin-manager/authentication/index.html",
  "Users": "admin-manager/users/index.html",
  "New user": "admin-manager/new-user/index.html",
  "Groups": "admin-manager/groups/index.html"
};

function sectionOf(issue) {
  const parts = (issue.screen || "").split(" > ");
  return parts[1] || "Other";
}

// Mirrors the real Admin Manager left nav order. Sections/pages not listed
// here fall back to the end, in the order they're first encountered.
const SECTION_ORDER = ["Application Settings", "User Management", "System Configuration", "Subscriptions", "Security"];
const PAGE_ORDER = {
  "Application Settings": ["Pipeline validation", "SnapGPT", "Optimized Dashboard", "API Management", "AutoSync", "Asset catalog"],
  "User Management": ["Users", "New user", "Groups", "Roles"],
  "System Configuration": ["Environment", "Snaplexes", "Cloudplex Secure Connectivity", "Git Integration", "Custom privacy notice"],
  "Subscriptions": ["Snap Packs"],
  "Security": ["Password expiration", "Session timeout", "Authentication", "Email encryption"]
};

function byKnownOrder(order) {
  return (a, b) => {
    const ai = order.indexOf(a);
    const bi = order.indexOf(b);
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  };
}

const SEVERITY_RANK = { highest: 3, high: 2, medium: 1, low: 0 };

function severityClass(sev) {
  return "severity-" + (sev || "").toLowerCase();
}

function highestSeverity(pageIssues) {
  return pageIssues.reduce((worst, issue) => {
    const sev = issue.severity || "";
    const rank = SEVERITY_RANK[sev.toLowerCase()] ?? -1;
    const worstRank = SEVERITY_RANK[(worst || "").toLowerCase()] ?? -1;
    return rank > worstRank ? sev : worst;
  }, pageIssues[0] && pageIssues[0].severity);
}

fetch("issues.json")
  .then(r => r.json())
  .then(data => {
    const issues = data.issues || [];

    const byArea = {};
    issues.forEach(issue => {
      const area = issue.area || "Uncategorized";
      (byArea[area] = byArea[area] || []).push(issue);
    });

    const html = AREAS.map(area => {
      const areaIssues = byArea[area] || [];
      if (!areaIssues.length) {
        return `<div class="area-title">${area}</div><p class="empty">— no tickets filed —</p>`;
      }

      const bySection = {};
      const sectionOrder = [];
      areaIssues.forEach(issue => {
        const section = sectionOf(issue);
        if (!bySection[section]) {
          bySection[section] = [];
          sectionOrder.push(section);
        }
        bySection[section].push(issue);
      });
      sectionOrder.sort(byKnownOrder(SECTION_ORDER));

      const sectionsHtml = sectionOrder.map(section => {
        const byPage = {};
        const pageOrder = [];
        bySection[section].forEach(issue => {
          const page = issue.page || issue.title;
          if (!byPage[page]) {
            byPage[page] = [];
            pageOrder.push(page);
          }
          byPage[page].push(issue);
        });
        pageOrder.sort(byKnownOrder(PAGE_ORDER[section] || []));

        const itemsHtml = pageOrder.map(page => {
          const pageIssues = byPage[page];
          const count = pageIssues.length;
          const href = count > 1
            ? (LANDING_PAGES[page] || "#")
            : (pageIssues[0].mockups || {}).comparison || (pageIssues[0].mockups || {}).currentUi || "#";
          const sev = highestSeverity(pageIssues);
          const sevLabel = sev ? `<span class="severity ${severityClass(sev)}">${sev}</span>` : "";
          const countLabel = count > 1 ? `<span class="issue-count">${count} issues</span>` : "";
          return `<li class="page-item"><a class="page-link" href="${href}"><span class="title">${page}</span><span class="right">${countLabel}${sevLabel}<span class="chevron">→</span></span></a></li>`;
        }).join("");

        const listHeader = `<div class="list-header"><span>Severity</span></div>`;

        return `<div class="section-title">${section}</div>${listHeader}<ul class="page-list">${itemsHtml}</ul>`;
      }).join("");

      return `<div class="area-title">${area}</div>${sectionsHtml}`;
    }).join("");

    document.getElementById("app").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("app").innerHTML =
      `<p class="empty">Couldn't load issues.json (${err.message}). If you're viewing this file directly from disk, open it via the live site instead — browsers block local file fetches.</p>`;
  });
</script>
</body>
</html>
