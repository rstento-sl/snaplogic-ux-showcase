<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UX Issue Showcase</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    padding: 48px 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  .sub { color: #555; margin-bottom: 32px; line-height: 1.5; }

  .area-title {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #888;
    margin: 32px 0 12px;
  }
  .area-title:first-of-type { margin-top: 0; }
  .empty { color: #999; font-size: 13px; font-style: italic; }

  .issue-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .issue-card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tag {
    font-size: 11px;
    font-weight: 600;
    color: #444;
    background: #f0f0f0;
    padding: 3px 9px;
    border-radius: 10px;
  }
  .severity {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 10px;
  }
  .severity-high { background: #fdecea; color: #B61631; }
  .severity-medium { background: #fff3e0; color: #C75209; }
  .severity-low { background: #eef2f6; color: #555; }

  .issue-card h2 { font-size: 16px; margin-bottom: 4px; }
  .issue-card .meta { font-size: 12px; color: #888; margin-bottom: 10px; }
  .issue-card .summary { font-size: 13px; color: #444; line-height: 1.5; margin-bottom: 16px; }

  .links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .issue-card a {
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid;
    background: #fff;
  }
  .issue-card a.primary { color: #0841B4; border-color: #0841B4; }
  .issue-card a.primary:hover { background: #E6ECF8; }
  .issue-card a.secondary { color: #C75209; border-color: #C75209; }
  .issue-card a.secondary:hover { background: #FEF0E7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>UX Issue Showcase</h1>
  <p class="sub">Confusing UI interactions and microcopy across the SnapLogic Admin UI, with proposed fixes.</p>
  <div id="app"><p class="empty">Loading issue catalog…</p></div>
</div>

<script>
const AREAS = ["Admin Manager", "Monitor", "SnapGPT"];

function severityClass(sev) {
  return "severity-" + (sev || "").toLowerCase();
}

function renderCard(issue) {
  const pinCount = (issue.annotations || []).length;
  const m = issue.mockups || {};
  return `
    <div class="issue-card">
      <div class="issue-card-top">
        <span class="tag">${issue.category || ""}</span>
        <span class="severity ${severityClass(issue.severity)}">${issue.severity || ""}</span>
      </div>
      <h2>${issue.title}</h2>
      <div class="meta">${issue.screen}${issue.jira ? " &nbsp;·&nbsp; " + issue.jira : ""}</div>
      <p class="summary">${issue.summary || ""}</p>
      <div class="links">
        ${m.comparison ? `<a class="primary" href="${m.comparison}">Current (${pinCount} issue${pinCount === 1 ? "" : "s"}) and proposed design</a>` : ""}
        ${m.possibleBug ? `<a class="secondary" href="${m.possibleBug}">Possible Bug</a>` : ""}
      </div>
    </div>
  `;
}

fetch("issues.json")
  .then(r => r.json())
  .then(data => {
    const byArea = {};
    (data.issues || []).forEach(issue => {
      const area = issue.area || "Uncategorized";
      (byArea[area] = byArea[area] || []).push(issue);
    });

    const html = AREAS.map(area => {
      const issues = byArea[area] || [];
      const body = issues.length
        ? issues.map(renderCard).join("")
        : `<p class="empty">No issues cataloged yet.</p>`;
      return `<div class="area-title">${area}</div>${body}`;
    }).join("");

    document.getElementById("app").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("app").innerHTML =
      `<p class="empty">Couldn't load issues.json (${err.message}). If you're viewing this file directly from disk, open it via the live site instead — browsers block local file fetches.</p>`;
  });
</script>
</body>
</html>
