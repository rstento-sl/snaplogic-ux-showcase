<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UX Issue Showcase</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1F2125;
    --dim: #7D8695;
    --paper: #FAFAFB;
    --canvas: #EBEDF1;
    --hairline: #D7DCE3;
    --teal: #09817F;
    --teal-tint: #E6F2F2;
    --red: #E31C3D;
    --red-tint: #FDF3F5;
    --red-ink: #B61631;
    --orange: #C75209;
    --orange-tint: #FEF0E7;
    --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    padding-bottom: 64px;
  }

  .topbar { height: 4px; background: var(--teal); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 0; }

  header { margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .sub { color: var(--dim); margin-bottom: 36px; line-height: 1.5; font-size: 14px; max-width: 52ch; }

  .area-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--dim);
    letter-spacing: 0.01em;
    margin: 36px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
  }
  .area-title:first-of-type { margin-top: 0; }
  .area-title::after { content: "/"; color: var(--hairline); margin-left: 2px; }

  .empty {
    border: 1px dashed var(--hairline);
    border-radius: 6px;
    padding: 18px 20px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
  }

  .issue-card {
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 4px rgba(206, 217, 240, 0.6);
  }
  .issue-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .ticket-id {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--teal);
    border: 1px solid var(--teal);
    padding: 2px 8px;
    border-radius: 4px;
    text-decoration: none;
  }
  .ticket-id:hover { background: var(--teal-tint); }
  span.ticket-id {
    color: var(--dim);
    border-color: var(--hairline);
    cursor: default;
  }
  .badges { display: flex; align-items: center; gap: 6px; }
  .tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--dim);
    background: var(--canvas);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .severity {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .severity-high { background: var(--red-tint); color: var(--red-ink); }
  .severity-medium { background: var(--orange-tint); color: var(--orange); }
  .severity-low { background: var(--canvas); color: var(--dim); }

  .issue-card h2 { font-size: 17px; font-weight: 800; margin-bottom: 4px; line-height: 1.3; }
  .issue-card .meta { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-bottom: 12px; }
  .issue-card .summary { font-size: 13px; color: #444; line-height: 1.55; margin-bottom: 18px; }

  .links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .issue-card a {
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1px solid;
  }
  .issue-card a.primary { color: #fff; background: var(--teal); border-color: var(--teal); }
  .issue-card a.primary:hover { background: #076766; border-color: #076766; }
  .issue-card a.secondary { color: var(--orange); border-color: var(--orange); background: transparent; }
  .issue-card a.secondary:hover { background: var(--orange-tint); }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <header>
    <h1>UX issue showcase</h1>
  </header>
  <p class="sub">Confusing UI interactions and microcopy across the SnapLogic Admin UI, with proposed fixes — for PM and engineering review.</p>
  <div id="app"><p class="empty">// loading issue catalog…</p></div>
</div>

<script>
const AREAS = ["Admin Manager", "Monitor", "SnapGPT"];
const JIRA_BASE_URL = "https://mysnaplogic.atlassian.net/browse/";

function severityClass(sev) {
  return "severity-" + (sev || "").toLowerCase();
}

function renderCard(issue) {
  const pinCount = (issue.annotations || []).length;
  const m = issue.mockups || {};
  const ticketLabel = issue.jira || issue.unreportedLabel || issue.id || "";
  const ticketEl = issue.jira
    ? `<a class="ticket-id" href="${JIRA_BASE_URL}${issue.jira}" target="_blank" rel="noopener">Jira ticket ${ticketLabel}</a>`
    : `<span class="ticket-id">${ticketLabel}</span>`;
  return `
    <div class="issue-card">
      <div class="issue-card-top">
        ${ticketEl}
        <div class="badges">
          <span class="tag">${issue.category || ""}</span>
          <span class="severity ${severityClass(issue.severity)}">${issue.severity || ""}</span>
        </div>
      </div>
      <h2>${issue.title}</h2>
      <div class="meta">${issue.screen}</div>
      <p class="summary">${issue.summary || ""}</p>
      <div class="links">
        ${m.comparison ? `<a class="primary" href="${m.comparison}">Current UI and proposed design</a>` : ""}
        ${!m.comparison && m.currentUi ? `<a class="primary" href="${m.currentUi}">Current UI (${pinCount} issue${pinCount === 1 ? "" : "s"}) — proposed design pending</a>` : ""}
        ${m.possibleBug ? `<a class="secondary" href="${m.possibleBug}">Possible Bug</a>` : ""}
      </div>
    </div>
  `;
}

fetch("issues.json")
  .then(r => r.json())
  .then(data => {
    const issues = data.issues || [];

    const byArea = {};
    issues.forEach(issue => {
      const area = issue.area || "Uncategorized";
      (byArea[area] = byArea[area] || []).push(issue);
    });

    const html = AREAS.map(area => {
      const areaIssues = byArea[area] || [];
      const body = areaIssues.length
        ? areaIssues.map(renderCard).join("")
        : `<p class="empty">— no tickets filed —</p>`;
      return `<div class="area-title">${area}</div>${body}`;
    }).join("");

    document.getElementById("app").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("app").innerHTML =
      `<p class="empty">Couldn't load issues.json (${err.message}). If you're viewing this file directly from disk, open it via the live site instead — browsers block local file fetches.</p>`;
  });
</script>
</body>
</html>
